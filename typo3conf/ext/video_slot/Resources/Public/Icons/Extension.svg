		<rect x="38" y="41.8" width="4.2" height="3.8" rx="0.5"/>
	</g>
	<rect x="17" y="47" width="26" height="4" rx="1" fill="#2b1509"/><!-- ck-nixie-dark -->
	<rect x="19" y="48.2" width="22" height="1.8" rx="0.9" fill="#ff8c1f"/><!-- ck-nixie-glow -->
	<g fill="#4a3a2b"><!-- ck-bulb-off -->
		<circle cx="21" cy="53.6" r="1.6"/>
