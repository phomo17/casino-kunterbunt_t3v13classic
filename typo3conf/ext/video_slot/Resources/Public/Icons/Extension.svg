		<rect x="28" y="37.4" width="4.2" height="3.8" rx="0.5"/>
		<rect x="33" y="37.4" width="4.2" height="3.8" rx="0.5"/>
		<rect x="38" y="37.4" width="4.2" height="3.8" rx="0.5"/>
		<rect x="18" y="41.8" width="4.2" height="3.8" rx="0.5"/>
