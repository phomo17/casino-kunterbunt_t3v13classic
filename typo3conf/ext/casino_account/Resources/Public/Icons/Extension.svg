<?xml version="1.0" encoding="UTF-8"?>
<!--
	Symbol der Extension in der Erweiterungsverwaltung.

	Dieselbe Chip-Zeichnung wie die Modulgruppe „Casino", damit Extension und
	Reiter erkennbar zusammengehören. Selbst konstruiert aus Grundformen
	(Kreisring, sechs rotierte Rechtecke), nicht nachgezeichnet. Keine Zahl,
	keine Schrift, kein Kartensymbol.

	viewBox 16 x 16, fill="currentColor": nimmt die Farbe des jeweiligen
	Erscheinungsbilds (hell/dunkel) an.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img">
	<title>Casino Kunterbunt – Konten und QR-Codes</title>
	<g fill="currentColor">
		<path fill-rule="evenodd" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 2.7a4.3 4.3 0 1 1 0 8.6 4.3 4.3 0 0 1 0-8.6z" />
		<rect x="7.4" y="1" width="1.2" height="1.6" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(60 8 8)" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(120 8 8)" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(180 8 8)" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(240 8 8)" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(300 8 8)" />
	</g>
</svg>
