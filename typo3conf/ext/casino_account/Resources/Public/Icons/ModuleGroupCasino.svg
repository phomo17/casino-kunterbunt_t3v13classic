<?xml version="1.0" encoding="UTF-8"?>
<!--
	Symbol der Modulgruppe „Casino" (CONCEPT.md D.2).

	Motiv: ein Spielchip von vorn — ein Kreis, darin ein zweiter, kleinerer
	Kreis, und am Rand sechs gleichmäßig verteilte kurze Striche als die
	hellen Randfelder. Keine Zahl, keine Schrift, kein Kartensymbol
	(Kartenfarben sind bei manchen Häusern als Bildmarke geschützt — der Chip
	ist die neutralste Form). Selbst konstruiert aus Grundformen (Kreisring,
	sechs rotierte Rechtecke), nicht nachgezeichnet.

	viewBox 16 x 16, fill="currentColor": ein Backend-Symbol nimmt die Farbe
	des jeweiligen Erscheinungsbilds (hell/dunkel) an, deshalb keine eigene
	Farbe hier.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img">
	<title>Casino</title>
	<g fill="currentColor">
		<path fill-rule="evenodd" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 2.7a4.3 4.3 0 1 1 0 8.6 4.3 4.3 0 0 1 0-8.6z" />
		<rect x="7.4" y="1" width="1.2" height="1.6" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(60 8 8)" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(120 8 8)" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(180 8 8)" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(240 8 8)" />
		<rect x="7.4" y="1" width="1.2" height="1.6" transform="rotate(300 8 8)" />
	</g>
</svg>
