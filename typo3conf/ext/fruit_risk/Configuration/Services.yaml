services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Phomo17\FruitRisk\:
    resource: '../Classes/*'
    # Reine Namensschilder und Spielgrundlagen, nie aus dem Container geholt.
    # Ohne diese Ausnahme meldete der Container Dienste an, die es nie geben
    # darf — beide Klassen haben einen privaten Konstruktor.
    exclude: '../Classes/{FruitRisk.php,Rules.php}'

  # Meldet den DataProcessor unter dem kurzen TypoScript-Namen
  # „fruit-risk-cabinet" an. Der Name trägt den Automaten im Präfix, damit
  # ein anderer Automat ihn nicht überschreiben kann.
  Phomo17\FruitRisk\DataProcessing\CabinetProcessor:
    tags:
      - { name: 'data.processor', identifier: 'fruit-risk-cabinet' }
