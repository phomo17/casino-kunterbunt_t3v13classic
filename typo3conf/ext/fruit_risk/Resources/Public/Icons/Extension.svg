<?xml version="1.0" encoding="UTF-8"?>
<!--
	Icon der Extension im Erweiterungs-Modul.

	AUSNAHME VON DER TOKEN-REGEL: hier stehen ausgeschriebene Hexwerte. Ein
	Backend-Icon wird von TYPO3 ausserhalb des Frontend-Dokuments eingebunden;
	dort sind die Custom Properties aus tokens.css nicht definiert und ein
	var(...) bliebe farblos. Die drei vorhandenen Geraete machen es genauso.
	Damit alle aus derselben Palette kommen, sind die Werte aus tokens.css
	abgeschrieben; der Tokenname steht je Wert daneben, ohne die beiden
	fuehrenden Bindestriche.

	Das breite Gehaeuse ist das Erkennungszeichen: ein Korpus, der fast die
	ganze Kachel ausfuellt, mit abgeschraegten Schultern statt runder, einem
	Sichtfeld von sechs Spalten und fuenf Zeilen und einer Tastenreihe
	darunter statt einer Konsole an der Flanke.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
	<title>FruitRisk</title>
	<rect width="64" height="64" rx="10" fill="#2c0b11"/><!-- ck-wall-base -->
	<path d="M5 55V17l5-5h44l5 5v38z" fill="#452b19"/><!-- ck-wood-300 -->
