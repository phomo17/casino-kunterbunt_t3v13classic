<?xml version="1.0" encoding="UTF-8"?>
<!--
	Icon der Extension im Erweiterungs-Modul.

	AUSNAHME VON DER TOKEN-REGEL: hier stehen ausgeschriebene Hexwerte. Ein
	Backend-Icon wird von TYPO3 ausserhalb des Frontend-Dokuments eingebunden;
	dort sind die Custom Properties aus tokens.css nicht definiert und ein
	var(…) bliebe farblos. Die anderen sechs Geraete dieses Projekts machen es
	genauso. Damit alle aus derselben Palette kommen, sind die Werte aus
	tokens.css abgeschrieben; der Tokenname steht je Wert daneben, ohne die
	beiden fuehrenden Bindestriche (zwei Bindestriche sind in einem
	XML-Kommentar nicht erlaubt). ck-rubber-pyramid ist der fuer diese Phase
	vorgesehene neue Token (siehe Plan-Abschnitt 4.27); sein Wert ist hier
	bereits bekannt und wird deshalb schon jetzt benutzt.

	Motiv: Blick von oben in eine Tischwanne. Ein Rechteck mit gerundeten Ecken
	in Mahagoni, darin eine Messinglinie, darin eine gruene Tuchflaeche. An der
	linken Innenkante eine Zackenleiste aus fuenf Dreiecken (der
	Pyramidengummi), rechts darauf zwei Wuerfel mit gezeichneten Augen (fuenf
	und zwei - die Summe sieben ist die gelaeufigste Zahl des Spiels und ein
	reines Motiv, kein behauptetes Ergebnis). Keine Buchstaben, keine Ziffern,
	kein Unicode-Wuerfelzeichen (CONCEPT.md B.3 Nr. 5/6/7) - Augen sind immer
	gezeichnete Kreise.

	Selbst konstruiert aus Grundformen (abgerundete Rechtecke, Dreiecke,
	Kreise), nicht nachgezeichnet.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
	<title>Craps</title>
	<rect x="4" y="4" width="56" height="56" rx="8" fill="#452b19" stroke="#1a0f08" stroke-width="1.6"/><!-- ck-wood-300 / ck-wood-500, Wannenrahmen -->
	<rect x="9" y="9" width="46" height="46" rx="6" fill="none" stroke="#bd9333" stroke-width="1.2"/><!-- ck-brass-300, Messingkante -->
	<rect x="12" y="12" width="40" height="40" rx="4" fill="#143f24"/><!-- ck-felt-green-dark -->
	<rect x="13.5" y="13.5" width="37" height="37" rx="3.5" fill="#1c5c33"/><!-- ck-felt-green, Tuch -->
	<g fill="#241f1c"><!-- ck-rubber-pyramid, Pyramidengummi an der linken Bande -->
		<path d="M13.5 13.5 L17 17.25 L13.5 21 Z" transform="translate(0 0)"/>
		<path d="M13.5 13.5 L17 17.25 L13.5 21 Z" transform="translate(0 7.5)"/>
		<path d="M13.5 13.5 L17 17.25 L13.5 21 Z" transform="translate(0 15)"/>
		<path d="M13.5 13.5 L17 17.25 L13.5 21 Z" transform="translate(0 22.5)"/>
		<path d="M13.5 13.5 L17 17.25 L13.5 21 Z" transform="translate(0 30)"/>
	</g>
	<g><!-- erster Wuerfel, fuenf Augen -->
		<rect x="22" y="16" width="14" height="14" rx="2.2" fill="#f2ead6" stroke="#8a7a5e" stroke-width="0.7"/><!-- ck-ivory-100 / ck-card-edge -->
		<g fill="#1f150d"><!-- ck-print-ink -->
			<circle cx="25.5" cy="19.5" r="1.4"/>
			<circle cx="32.5" cy="19.5" r="1.4"/>
			<circle cx="29" cy="23" r="1.4"/>
			<circle cx="25.5" cy="26.5" r="1.4"/>
			<circle cx="32.5" cy="26.5" r="1.4"/>
		</g>
	</g>
	<g><!-- zweiter Wuerfel, zwei Augen -->
		<rect x="32" y="28" width="14" height="14" rx="2.2" fill="#f2ead6" stroke="#8a7a5e" stroke-width="0.7"/><!-- ck-ivory-100 / ck-card-edge -->
		<g fill="#1f150d"><!-- ck-print-ink -->
			<circle cx="35.5" cy="31.5" r="1.4"/>
			<circle cx="42.5" cy="38.5" r="1.4"/>
		</g>
	</g>
</svg>
