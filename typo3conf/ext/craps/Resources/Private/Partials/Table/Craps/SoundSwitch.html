<f:comment>
	Der Ton-Schalter des Craps-Tisches.

	Ein echter <button type="button"> mit aria-pressed — ein Umschalter, kein
	Kontrollkästchen: er löst sofort eine Wirkung aus, statt eine Einstellung
	für ein späteres Absenden zu sammeln. (Der Place-Schalter im Tuch ist
	genau umgekehrt ein Kontrollkästchen, und aus genau diesem Grund.)

	Er trägt seinen Namen als SICHTBAREN Text im Knopf, nicht nur als
	aria-label: eine Sprachsteuerung sucht den sichtbaren Text, und
	„klicke Ton" muss funktionieren.

	Hinter dem Text liegt ein helles Namensschild (.cr-sound__label). Ohne es
	hinge der Kontrast davon ab, über welchem Teil des Messingverlaufs die
	Schrift gerade sitzt — genau der Fund, der am vierten Gerät alle
	Aufschriften von 2,43 : 1 auf 9,22 : 1 gehoben hat.

	Der Zustand steht NICHT allein in der Farbe: aria-pressed trägt ihn für
	Hilfsmittel, und der Messpunkt data-cr-sound-on macht ihn ablesbar.
</f:comment>
<button type="button" class="cr-sound" data-cr-sound="" aria-pressed="true"
	data-text-on="{f:translate(key: 'LLL:EXT:craps/Resources/Private/Language/locallang.xlf:sound.on')}"
	data-text-off="{f:translate(key: 'LLL:EXT:craps/Resources/Private/Language/locallang.xlf:sound.off')}">
	<span class="cr-sound__label">
		<f:translate key="LLL:EXT:craps/Resources/Private/Language/locallang.xlf:sound.label" />
	</span>
</button>
